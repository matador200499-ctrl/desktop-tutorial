name: weekly_publish.yml

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 6'  # كل سبت الساعة 8 الصبح

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install groq pexels_api python-dotenv requests moviepy pillow

      - name: Pick Video Topic
        run: python scripts/pick_topic.py

      - name: Generate Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_long_script.py

      - name: Generate Voiceover
        run: python scripts/generate_voiceover.py

      - name: Fetch Video Clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Download Arabic Font
        run: python scripts/download_font.py

      - name: Assemble Video
        run: python scripts/assemble_video.py

      - name: Upload Video to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/upload_youtube.py
