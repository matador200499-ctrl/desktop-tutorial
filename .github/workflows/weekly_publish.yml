import os
import sys
from groq import Groq

api_key = os.environ.get("GROQ_API_KEY")
if not api_key:
    print("FATAL ERROR: GROQ_API_KEY مش موجود")
    sys.exit(1)

client = Groq(api_key=api_key)

# قراءة الموضوع
topic = os.environ.get("VIDEO_TOPIC", "").strip()
if not topic:
    try:
        if os.path.exists("topic.txt"):
            with open("topic.txt", "r", encoding="utf-8") as f:
                topic = f.read().strip()
    except:
        pass

if not topic:
    try:
        with open("topics.txt", "r", encoding="utf-8") as f:
            lines = [l.strip() for l in f if l.strip()]
            if lines:
                topic = lines[0]
    except:
        pass

if not topic:
    topic = "كيف تغيرت حياتنا اليومية بسبب الخوارزميات"

print(f"Generating script for topic: {topic}")

MODELS_TO_TRY = [
    "llama3-70b-8192",
    "llama-3.1-70b-versatile",
    "llama-3.1-8b-instant"
]

def generate_script(topic_text):
    prompt = f'اكتب سكريبت فيديو يوتيوب طويل ومشوق بالعربي عن موضوع: "{topic_text}" - مقدمة قوية، 4 فصول، حوالي 1200 كلمة، وفي الاخر اطلب الاشتراك.'

    last_error = None
    for model_name in MODELS_TO_TRY:
        try:
            print(f"Trying model: {model_name}")
            response = client.chat.completions.create(
                model=model_name,
                messages=[
                    {"role": "system", "content": "انت كاتب سكريبتات يوتيوب محترف تكتب بالعربي."},
                    {"role": "user", "content": prompt}
                ],
                temperature=0.7,
                max_tokens=4096
            )
            return response.choices[0].message.content
        except Exception as e:
            print(f"Model {model_name} failed: {e}")
            last_error = e
            continue
    raise last_error

try:
    script_content = generate_script(topic)
    os.makedirs("output", exist_ok=True)
    with open("output/script.txt", "w", encoding="utf-8") as f:
        f.write(script_content)
    with open("script.txt", "w", encoding="utf-8") as f:
        f.write(script_content)
    print("✅ Script generated successfully!")
except Exception as e:
    print(f"FATAL ERROR while generating script: {e}")
    import traceback
    traceback.print_exc()
    sys.exit(1)
